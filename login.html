```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - CHAND INSTITUTE OF TECHNOLOGY</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 950px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
            overflow: hidden;
        }

        .header {
            background: #123c69;
            color: white;
            text-align: center;
            padding: 30px 20px;
        }

        .header h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 15px;
            opacity: 0.9;
        }

        .login-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            padding: 35px;
        }

        .login-box {
            border: 1px solid #ddd;
            border-radius: 15px;
            padding: 28px;
            background: #fff;
        }

        .student-box {
            border-top: 5px solid #198754;
        }

        .admin-box {
            border-top: 5px solid #123c69;
        }

        .login-title {
            text-align: center;
            margin-bottom: 22px;
        }

        .login-title .icon {
            font-size: 42px;
            margin-bottom: 8px;
        }

        .login-title h2 {
            color: #123c69;
            margin-bottom: 5px;
        }

        .student-box .login-title h2 {
            color: #198754;
        }

        .login-title p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #123c69;
            box-shadow: 0 0 0 2px rgba(18, 60, 105, 0.1);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 45px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 19px;
            user-select: none;
        }

        button {
            width: 100%;
            border: none;
            padding: 13px;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .student-button {
            background: #198754;
        }

        .student-button:hover {
            background: #157347;
        }

        .admin-button {
            background: #123c69;
        }

        .admin-button:hover {
            background: #0d2d50;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 7px;
            display: none;
            font-size: 14px;
            text-align: center;
        }

        .error {
            display: block;
            background: #f8d7da;
            color: #842029;
        }

        .success {
            display: block;
            background: #d1e7dd;
            color: #0f5132;
        }

        .register-link {
            text-align: center;
            padding: 0 20px 30px;
            color: #555;
        }

        .register-link a {
            color: #123c69;
            font-weight: bold;
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .divider {
            display: none;
        }

        @media (max-width: 700px) {
            .login-area {
                grid-template-columns: 1fr;
                padding: 20px;
            }

            .header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>CHAND INSTITUTE OF TECHNOLOGY</h1>
        <p>Online Learning Platform</p>
    </div>

    <div class="login-area">

        <!-- ================= STUDENT LOGIN ================= -->
        <div class="login-box student-box">

            <div class="login-title">
                <div class="icon">👨‍🎓</div>
                <h2>Student Login</h2>
                <p>Login to access your student account</p>
            </div>

            <form id="studentLoginForm">

                <div class="form-group">
                    <label for="studentEmail">Email Address</label>

                    <input
                        type="email"
                        id="studentEmail"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="studentPassword">Password</label>

                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="studentPassword"
                            placeholder="Enter your password"
                            required
                        >

                        <span
                            class="toggle-password"
                            onclick="togglePassword('studentPassword', this)"
                        >👁️</span>
                    </div>
                </div>

                <button
                    type="submit"
                    id="studentLoginButton"
                    class="student-button"
                >
                    LOGIN AS STUDENT
                </button>

                <div id="studentMessage" class="message"></div>

            </form>
        </div>


        <!-- ================= ADMIN LOGIN ================= -->
        <div class="login-box admin-box">

            <div class="login-title">
                <div class="icon">👨‍💼</div>
                <h2>Admin Login</h2>
                <p>Login to manage the learning platform</p>
            </div>

            <form id="adminLoginForm">

                <div class="form-group">
                    <label for="adminEmail">Admin Email</label>

                    <input
                        type="email"
                        id="adminEmail"
                        placeholder="Enter admin email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="adminPassword">Admin Password</label>

                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="adminPassword"
                            placeholder="Enter admin password"
                            required
                        >

                        <span
                            class="toggle-password"
                            onclick="togglePassword('adminPassword', this)"
                        >👁️</span>
                    </div>
                </div>

                <button
                    type="submit"
                    id="adminLoginButton"
                    class="admin-button"
                >
                    LOGIN AS ADMIN
                </button>

                <div id="adminMessage" class="message"></div>

            </form>
        </div>

    </div>


    <!-- REGISTER -->
    <div class="register-link">
        <p>
            Don't have a student account?
            <a href="register.html">Register as Student</a>
        </p>
    </div>

</div>


<!-- ================= SUPABASE ================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>


<script>

    // ==========================================
    // PASSWORD SHOW / HIDE
    // ==========================================

    function togglePassword(inputId, icon) {

        const input = document.getElementById(inputId);

        if (input.type === "password") {

            input.type = "text";
            icon.textContent = "🙈";

        } else {

            input.type = "password";
            icon.textContent = "👁️";
        }
    }


    // ==========================================
    // SHOW MESSAGE
    // ==========================================

    function showMessage(elementId, message, type) {

        const element = document.getElementById(elementId);

        element.textContent = message;

        element.className = "message " + type;
    }


    // ==========================================
    // RESET BUTTON
    // ==========================================

    function resetButton(buttonId, text) {

        const button = document.getElementById(buttonId);

        button.disabled = false;

        button.textContent = text;
    }


    // ==========================================
    // STUDENT LOGIN
    // ==========================================

    document
        .getElementById("studentLoginForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();

            const email =
                document
                .getElementById("studentEmail")
                .value
                .trim();

            const password =
                document
                .getElementById("studentPassword")
                .value;

            const button =
                document.getElementById("studentLoginButton");

            button.disabled = true;
            button.textContent = "LOGGING IN...";

            document.getElementById("studentMessage").className = "message";


            try {

                // LOGIN TO SUPABASE
                const {
                    data,
                    error
                } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });


                if (error) {
                    throw error;
                }


                const user = data.user;


                if (!user) {
                    throw new Error("User account not found.");
                }


                // GET PROFILE
                const {
                    data: profile,
                    error: profileError
                } = await supabaseClient
                    .from("profiles")
                    .select("full_name, phone, course, role")
                    .eq("id", user.id)
                    .maybeSingle();


                if (profileError) {
                    throw profileError;
                }


                // IF PROFILE DOES NOT EXIST,
                // CREATE STUDENT PROFILE

                if (!profile) {

                    const fullName =
                        user.user_metadata?.full_name || "";

                    const phone =
                        user.user_metadata?.phone || "";

                    const course =
                        user.user_metadata?.course || "";


                    const {
                        error: insertError
                    } = await supabaseClient
                        .from("profiles")
                        .insert({
                            id: user.id,
                            full_name: fullName,
                            phone: phone,
                            course: course
                        });


                    if (insertError) {
                        throw insertError;
                    }
                }


                // GET ROLE AGAIN
                const {
                    data: roleData,
                    error: roleError
                } = await supabaseClient
                    .from("profiles")
                    .select("role")
                    .eq("id", user.id)
                    .single();


                if (roleError) {
                    throw roleError;
                }


                // STUDENT LOGIN MUST BE STUDENT
                if (roleData.role !== "student") {

                    await supabaseClient.auth.signOut();

                    throw new Error(
                        "This account is not a Student account. Please use Admin Login."
                    );
                }


                showMessage(
                    "studentMessage",
                    "Login successful. Opening Student Dashboard...",
                    "success"
                );


                setTimeout(function() {

                    window.location.href = "dashboard.html";

                }, 800);


            } catch (error) {

                console.error("Student Login Error:", error);

                showMessage(
                    "studentMessage",
                    error.message || "Student login failed.",
                    "error"
                );

                resetButton(
                    "studentLoginButton",
                    "LOGIN AS STUDENT"
                );
            }

        });


    // ==========================================
    // ADMIN LOGIN
    // ==========================================

    document
        .getElementById("adminLoginForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();

            const email =
                document
                .getElementById("adminEmail")
                .value
                .trim();

            const password =
                document
                .getElementById("adminPassword")
                .value;

            const button =
                document.getElementById("adminLoginButton");

            button.disabled = true;
            button.textContent = "LOGGING IN...";

            document.getElementById("adminMessage").className = "message";


            try {

                // LOGIN TO SUPABASE
                const {
                    data,
                    error
                } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });


                if (error) {
                    throw error;
                }


                const user = data.user;


                if (!user) {
                    throw new Error("Admin account not found.");
                }


                // GET PROFILE ROLE
                const {
                    data: profile,
                    error: profileError
                } = await supabaseClient
                    .from("profiles")
                    .select("full_name, role")
                    .eq("id", user.id)
                    .maybeSingle();


                if (profileError) {
                    throw profileError;
                }


                // CHECK ADMIN ROLE
                if (!profile || profile.role !== "admin") {

                    await supabaseClient.auth.signOut();

                    throw new Error(
                        "Access denied. This account is not an Admin account."
                    );
                }


                showMessage(
                    "adminMessage",
                    "Admin login successful. Opening Admin Dashboard...",
                    "success"
                );


                setTimeout(function() {

                    window.location.href = "admin.html";

                }, 800);


            } catch (error) {

                console.error("Admin Login Error:", error);

                showMessage(
                    "adminMessage",
                    error.message || "Admin login failed.",
                    "error"
                );

                resetButton(
                    "adminLoginButton",
                    "LOGIN AS ADMIN"
                );
            }

        });

</script>

</body>
</html>
