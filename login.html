<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - CHAND COMPUTER COURSE</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f7fb;
}

header{
    background:#123c69;
    color:white;
    padding:20px;
    text-align:center;
}

header a{
    color:white;
    text-decoration:none;
}

.container{
    max-width:500px;
    margin:60px auto;
    padding:20px;
}

.login-box{
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 3px 15px rgba(0,0,0,.1);
}

h2{
    text-align:center;
    color:#123c69;
    margin-bottom:25px;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:7px;
    font-weight:bold;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #ccc;
    border-radius:6px;
}

button{
    width:100%;
    margin-top:25px;
    padding:14px;
    border:none;
    border-radius:7px;
    background:#123c69;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.register-link{
    text-align:center;
    margin-top:20px;
}

.register-link a{
    color:#123c69;
    font-weight:bold;
}
</style>
</head>

<body>

<header>

<h1>CHAND COMPUTER COURSE</h1>

<p>
<a href="index.html">← Back to Home</a>
</p>

</header>

<div class="container">

<div class="login-box">

<h2>Student Login</h2>

<form id="loginForm">

<label>Email Address</label>

<input
    type="email"
    id="email"
    placeholder="Enter your email"
    required
>

<label>Password</label>

<input
    type="password"
    id="password"
    placeholder="Enter your password"
    required
>

<button type="submit">
LOGIN
</button>

</form>

<div class="register-link">

Don't have an account?

<a href="register.html">
Create Account
</a>

</div>

</div>

</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>

<script>

document.getElementById("loginForm").addEventListener("submit", async function(event){

    event.preventDefault();

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const { data, error } = await supabase.auth.signInWithPassword({
        email: email,
        password: password
    });

    if(error){
        alert(error.message);
        return;
    }

    alert("Login successful!");

});

</script>

</body>
</html>
