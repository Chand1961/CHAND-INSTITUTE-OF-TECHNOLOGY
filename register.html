<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Registration - CHAND COMPUTER COURSE</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f4f7fb;
}

header{
    background:#123c69;
    color:white;
    padding:25px;
    text-align:center;
}

header h1{
    margin-bottom:10px;
}

header a{
    color:white;
    text-decoration:none;
}

.container{
    max-width:550px;
    margin:40px auto;
    padding:20px;
}

.register-box{
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 4px 20px rgba(0,0,0,0.12);
}

h2{
    text-align:center;
    color:#123c69;
    margin-bottom:25px;
}

label{
    display:block;
    font-weight:bold;
    margin-top:16px;
    margin-bottom:7px;
}

input,
select{
    width:100%;
    padding:13px;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:16px;
}

input:focus,
select:focus{
    outline:none;
    border-color:#123c69;
}

button{
    width:100%;
    padding:14px;
    margin-top:25px;
    border:none;
    border-radius:7px;
    background:#123c69;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    background:#777;
}

.message{
    display:none;
    margin-top:18px;
    padding:12px;
    border-radius:7px;
    text-align:center;
}

.login-link{
    text-align:center;
    margin-top:20px;
}

.login-link a{
    color:#123c69;
    font-weight:bold;
    text-decoration:none;
}

</style>

</head>


<body>


<header>

<h1>CHAND COMPUTER COURSE</h1>

<p>
<a href="index.html">← Back to Home</a>
</p>

</header>



<div class="container">

<div class="register-box">

<h2>Student Registration</h2>


<form id="registerForm">


<label for="fullName">
Full Name
</label>

<input
    type="text"
    id="fullName"
    placeholder="Enter your full name"
    required
>


<label for="phone">
Phone Number
</label>

<input
    type="tel"
    id="phone"
    placeholder="Enter your phone number"
    required
>


<label for="email">
Email Address
</label>

<input
    type="email"
    id="email"
    placeholder="Enter your email"
    required
>


<label for="course">
Select Course
</label>

<select id="course" required>

<option value="">
-- Select Course --
</option>

<option value="Computer Basics">
Computer Basics
</option>

<option value="Microsoft Office">
Microsoft Office
</option>

<option value="Web Design">
Web Design
</option>

<option value="Web Development">
Web Development
</option>

<option value="Graphic Design">
Graphic Design
</option>

<option value="Internet & Online Services">
Internet & Online Services
</option>

</select>


<label for="password">
Password
</label>

<input
    type="password"
    id="password"
    placeholder="Create password"
    required
>


<label for="confirmPassword">
Confirm Password
</label>

<input
    type="password"
    id="confirmPassword"
    placeholder="Confirm password"
    required
>


<button
    type="submit"
    id="registerButton"
>
CREATE ACCOUNT
</button>


<div
    id="message"
    class="message"
></div>


</form>


<div class="login-link">

<p>
Already have an account?
</p>

<br>

<a href="login.html">
Login Here
</a>

</div>


</div>

</div>



<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>


<script>


const registerForm =
    document.getElementById("registerForm");

const registerButton =
    document.getElementById("registerButton");

const message =
    document.getElementById("message");



registerForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        const fullName =
            document.getElementById("fullName").value.trim();

        const phone =
            document.getElementById("phone").value.trim();

        const email =
            document.getElementById("email").value.trim();

        const course =
            document.getElementById("course").value;

        const password =
            document.getElementById("password").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;


        /* CHECK PASSWORD */

        if(password !== confirmPassword){

            showMessage(
                "Passwords do not match!",
                "error"
            );

            return;

        }


        if(password.length < 6){

            showMessage(
                "Password must be at least 6 characters.",
                "error"
            );

            return;

        }


        registerButton.disabled = true;

        registerButton.innerText =
            "CREATING ACCOUNT...";


        try{


            /* CREATE SUPABASE ACCOUNT */

            const {
                data,
                error
            } =
            await supabaseClient.auth.signUp({

                email: email,

                password: password,

                options: {

                    data: {

                        full_name: fullName,

                        phone: phone,

                        course: course

                    }

                }

            });


            if(error){

                showMessage(
                    "REGISTRATION ERROR: " +
                    error.message,
                    "error"
                );

                registerButton.disabled = false;

                registerButton.innerText =
                    "CREATE ACCOUNT";

                return;

            }


            if(!data.user){

                showMessage(
                    "Registration failed. Please try again.",
                    "error"
                );

                registerButton.disabled = false;

                registerButton.innerText =
                    "CREATE ACCOUNT";

                return;

            }


            showMessage(
                "Registration successful! Please check your email and confirm your account.",
                "success"
            );


            registerForm.reset();


            registerButton.disabled = false;

            registerButton.innerText =
                "CREATE ACCOUNT";


        }

        catch(error){

            showMessage(
                "Something went wrong: " +
                error.message,
                "error"
            );

            registerButton.disabled = false;

            registerButton.innerText =
                "CREATE ACCOUNT";

        }

    }
);



function showMessage(text,type){

    message.style.display = "block";

    message.innerText = text;


    if(type === "error"){

        message.style.background = "#ffe5e5";

        message.style.color = "#b00020";

    }


    if(type === "success"){

        message.style.background = "#e5ffe9";

        message.style.color = "#087f23";

    }

}


</script>


</body>

</html>
